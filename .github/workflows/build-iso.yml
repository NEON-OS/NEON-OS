
name: Build NEON OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Clean old build configuration
        run: |
          sudo rm -rf config
          sudo rm -rf .build chroot binary

      - name: Configure Debian Live
        run: |
          lb config \
            --ignore-system-defaults \
            --distribution bookworm \
            --architectures amd64 \
            --binary-image iso-hybrid \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootstrap-keyring debian-archive-keyring \
            --keyring-packages debian-archive-keyring \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --mirror-chroot-security http://security.debian.org/debian-security/ \
            --mirror-binary-security http://security.debian.org/debian-security/ \
            --bootloader grub \
            --apt-indices false \
            --firmware-binary true \
            --firmware-chroot false

      - name: Add NEON OS packages
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/neon.list.chroot << 'EOF'
          live-boot
          live-config
          linux-image-amd64
          systemd-sysv
          xfce4
          xfce4-terminal
          lightdm
          network-manager
          network-manager-gnome
          sudo
          firefox-esr
          dbus-x11
          fonts-dejavu
          EOF

      - name: Build NEON OS ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          ls -lh *.iso
          file *.iso

      - name: Upload NEON OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
