
name: Build NEON OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            file

      - name: Remove old build system
        run: |
          sudo rm -rf auto config .build chroot binary
          sudo rm -f config* binary*

      - name: Configure Debian Bookworm
        run: |
          sudo lb config noauto \
            --ignore-system-defaults \
            --distribution bookworm \
            --architectures amd64 \
            --binary-image iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootstrap-keyring debian-archive-keyring \
            --keyring-packages debian-archive-keyring \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --mirror-chroot-security http://security.debian.org/debian-security/ \
            --mirror-binary-security http://security.debian.org/debian-security/ \
            --bootloader grub \
            --apt-indices false \
            --firmware-binary true \
            --firmware-chroot false

      - name: Create NEON OS packages
        run: |
          sudo mkdir -p config/package-lists
          sudo tee config/package-lists/neon.list.chroot > /dev/null <<'EOF'
          live-boot
          live-config
          linux-image-amd64
          systemd-sysv
          xfce4
          xfce4-terminal
          lightdm
          network-manager
          network-manager-gnome
          sudo
          firefox-esr
          dbus-x11
          fonts-dejavu
          EOF

      - name: Verify configuration
        run: |
          echo "Searching all build files for linux-generic..."
          if sudo grep -Rni "linux-generic" . \
            --exclude-dir=.git 2>/dev/null; then
            echo "ERROR: Found linux-generic in build files."
            exit 1
          fi
          echo "No linux-generic references found."
          cat config/package-lists/neon.list.chroot

      - name: Build NEON OS ISO
        run: |
          sudo lb build noauto

      - name: Verify ISO
        run: |
          ls -lh *.iso
          file *.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
