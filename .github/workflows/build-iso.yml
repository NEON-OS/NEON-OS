name: Build NEON OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Configure NEON OS
        run: |
          sudo chmod +x auto/config
          sudo ./auto/config

      - name: Diagnose package configuration
        run: |
          echo "===== BUILD CONFIG ====="
          if [ -f .build/config ]; then
            sudo cat .build/config
          else
            echo ".build/config not found"
          fi

          echo "===== LIVE BUILD DEFAULTS ====="
          sudo grep -Rni "linux-generic" /usr/share/live/build /etc/live 2>/dev/null || true

          echo "===== ALL PACKAGE LISTS ====="
          sudo find config -type f -print -exec cat {} \;

          echo "===== SEARCH ENTIRE WORKSPACE ====="
          sudo grep -Rni --exclude-dir=.git "linux-generic" . 2>/dev/null || true

      - name: Build ISO
        run: |
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
          
