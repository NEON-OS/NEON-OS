name: Build NEON OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            file

      - name: Remove old configuration
        run: |
          sudo rm -rf auto config .build chroot binary
          sudo rm -f config* binary*

      - name: Configure Debian
        run: |
          sudo lb config noauto \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --linux-packages linux-image \
            --linux-flavours amd64 \
            --binary-image iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --mirror-chroot-security https://security.debian.org/debian-security/ \
            --mirror-binary-security https://security.debian.org/debian-security/ \
            --bootloader grub \
            --apt-indices false \
            --firmware-binary true \
            --firmware-chroot false

      - name: Create NEON OS package list
        run: |
          sudo mkdir -p config/package-lists
          sudo tee config/package-lists/neon.list.chroot > /dev/null <<'EOF'
          live-boot
          live-config
          linux-image-amd64
          systemd-sysv
          xfce4
          xfce4-terminal
          lightdm
          network-manager
          network-manager-gnome
          sudo
          firefox-esr
          dbus-x11
          fonts-dejavu
          EOF

      - name: Check configuration
        run: |
          echo "===== ARCHITECTURE ====="
          dpkg --print-architecture
          echo "===== SECURITY MIRROR ====="
          grep -R "security.debian.org" config || true
          echo "===== PACKAGE LIST ====="
          cat config/package-lists/neon.list.chroot

      - name: Build ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" | head -n 1)
          if [ -z "$ISO" ]; then
            echo "ERROR: No ISO was generated"
            exit 1
          fi
          echo "===== ISO DETAILS ====="
          ls -lh "$ISO"
          file "$ISO"
          echo "===== ISO SIZE ====="
          du -h "$ISO"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-1.0.0
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
