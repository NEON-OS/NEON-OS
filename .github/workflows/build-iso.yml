name: Build NEON OS ISO

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools syslinux-common isolinux

      - name: Configure NEON OS
        run: sudo lb config

      - name: Build ISO
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log

      - name: Collect ISO
        run: |
          mkdir -p dist
          sudo find . -maxdepth 1 -type f -name '*.iso' \
            -exec cp {} dist/ \;
          sudo chown -R "$USER":"$USER" dist
          test -n "$(find dist -name '*.iso' -print -quit)"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: neon-os-iso
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14
