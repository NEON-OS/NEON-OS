name: Build NEON OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mkosi
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mkosi \
            systemd-container \
            debootstrap \
            qemu-utils \
            xorriso

      - name: Check mkosi
        run: |
          mkosi --version
          mkosi summary

      - name: Build NEON OS
        run: |
          sudo mkosi build

      - name: Show build output
        run: |
          ls -lah mkosi.output/

      - name: Upload NEON OS image
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-1.0.0
          path: mkosi.output/*.raw
          if-no-files-found: error
