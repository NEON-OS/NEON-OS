name: Build NEON OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NEON OS
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            file

      - name: Remove old configuration
        run: |
          sudo lb clean --purge || true
          sudo rm -rf auto config .build chroot binary
          sudo rm -f config* binary*

      - name: Configure Debian Bookworm
        run: |
          sudo lb config noauto \
            --mode debian \
            --ignore-system-defaults \
            --distribution bookworm \
            --architectures amd64 \
            --linux-packages linux-image \
            --linux-flavours amd64 \
            --binary-image iso-hybrid \
            --debian-installer live \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootstrap-keyring debian-archive-keyring \
            --keyring-packages debian-archive-keyring \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --mirror-chroot-security http://security.debian.org/debian-security/ \
            --mirror-binary-security http://security.debian.org/debian-security/ \
            --bootloader grub \
            --apt-indices false \
            --firmware-binary true \
            --firmware-chroot false

      - name: Create NEON OS package list
        run: |
          sudo mkdir -p config/package-lists

          sudo tee config/package-lists/neon.list.chroot > /dev/null <<'EOF'
          live-boot
          live-config
          linux-image-amd64
          systemd-sysv
          xfce4
          xfce4-terminal
          lightdm
          network-manager
          network-manager-gnome
          sudo
          firefox-esr
          dbus-x11
          fonts-dejavu
          EOF

      - name: Verify Debian configuration
        run: |
          echo "Checking Debian build settings..."

          grep -h "LB_MODE=" config/* || true
          grep -h "LB_LINUX_PACKAGES=" config/* || true
          grep -h "LB_LINUX_FLAVOURS=" config/* || true

          echo "Checking package list..."
          cat config/package-lists/neon.list.chroot

          if grep -qx "linux-generic" config/package-lists/neon.list.chroot; then
            echo "ERROR: Ubuntu kernel package found."
            exit 1
          fi

      - name: Build NEON OS ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          echo "Checking ISO output..."
          find . -maxdepth 1 -type f -name "*.iso" -exec ls -lh {} \;

          ISO_COUNT=$(find . -maxdepth 1 -type f -name "*.iso" | wc -l)

          if [ "$ISO_COUNT" -eq 0 ]; then
            echo "ERROR: No ISO was generated."
            exit 1
          fi

          find . -maxdepth 1 -type f -name "*.iso" -exec file {} \;

      - name: Upload NEON OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
