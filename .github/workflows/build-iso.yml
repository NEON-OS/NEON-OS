name: Build NEON OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Configure NEON OS
        run: |
          sudo chmod +x auto/config
          sudo ./auto/config

      - name: Diagnose package configuration
        run: |
          echo "===== LIVE-BUILD CONFIGURATION ====="
          sudo lb config --dump || true

          echo "===== PACKAGE LIST FILES ====="
          find config/package-lists -maxdepth 2 -type f -print -exec cat {} \;

          echo "===== GENERATED PACKAGE LISTS ====="
          sudo find .build -maxdepth 4 -type f -print 2>/dev/null || true

          echo "===== SEARCH FOR UBUNTU KERNEL ====="
          sudo grep -Rni "linux-generic" config .build chroot 2>/dev/null || true

      - name: Build ISO
        run: |
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
          
