name: Build NEON OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso

      - name: Fix live-build Contents URL
        run: |
          sudo sed -i 's|${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz|${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz|g; s|${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz|${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz|g' /usr/lib/live/build/lb_chroot_linux-image

      - name: Configure NEON OS
        run: |
          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-chroot-security https://security.debian.org/debian-security \
            --mirror-binary-security https://security.debian.org/debian-security \
            --archive-areas "main contrib non-free non-free-firmware" \
            --iso-application "NEON OS" \
            --iso-publisher "NEON OS Project" \
            --iso-volume "NEON_OS" \
            --firmware-binary true \
            --firmware-chroot true

      - name: Build ISO
        run: sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NEON-OS-ISO
          path: "*.iso"
          if-no-files-found: error
