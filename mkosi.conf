
[Distribution]
Distribution=debian
Release=bookworm
Architecture=x86-64
RepositoryKeyFetch=yes

[Output]
Format=disk
Output=neon-os
OutputDirectory=mkosi.output
ImageId=NEON-OS
ImageVersion=1.0.0

[Include]
Include=mkosi-vm

[Content]
Bootable=yes
Hostname=neon
Packages=
    xfce4
    xfce4-terminal
    lightdm
    network-manager
    network-manager-gnome
    sudo
    firefox-esr
    dbus-x11
    fonts-dejavu
